[project]
name = "ai110-module1show-gameglitchinvestigator-starter"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Erioluwa Olajorin", email = "eaolajorin06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.21.0",
    "altair<5",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "logic_utils"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
